<script>/* skin first, so the page never flashes the wrong colors */

@media (prefers-reduced-motion:reduce){html[data-theme=terminal] .panel h2::after{animation:none}}

/* ---------- glass: frosted panels over a color glow, round soft shapes, thin type ---------- */
html[data-theme=glass]{
  color-scheme:dark;
  --bg:#14112e; --panel:#2a2550; --soft:#332d5e; --ink:#f5f3ff; --ink-soft:#ddd6fe; --muted:#c4b5fd;
  --line:#4a4478; --line-strong:#8b80c9;
  --accent:#a78bfa; --accent-hover:#c4b5fd; --accent-ink:#160f33; --accent-edge:#7c3aed;
  --warn:#fcd34d; --amber-bg:#3b3346; --warn-line:#fbbf24;
  --bar-bg:#1d1940; --bar-ink:#f5f3ff; --bar-muted:#c4b5fd; --bar-btn:#2f2a5a; --bar-btn-line:#5b5299;
  --tour:#f472b6; --tour-ink:#1a0b16; --tour-edge:#be185d;
  --shadow-card:0 8px 32px rgba(0,0,0,.35); --shadow-modal:0 20px 60px rgba(0,0,0,.5);
  --font:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --card:#1f1a45; --hover:#2f2a5a; --hover-warm:#2f2a5a; --err:#fda4af; --on-warn:#1a103d;
  --ok-bg:#183a3a; --ok-line:#34d399; --ok-ink:#6ee7b7; --run-ink:#7dd3fc; --run-line:#0ea5e9; --run-bg:#102a44;
  --hard-shadow:rgba(0,0,0,.4); --dim:rgba(10,8,30,.7); --backdrop:rgba(10,8,30,.55);
  --sc-wall:#2a2357; --sc-rail:#6d5bd0; --sc-rail2:#4c3fa0; --sc-floor1:#3a2f6e; --sc-floor2:#352b66; --sc-floorline:#2a2357;
  --sc-frame:#8b80c9; --sc-glass:#1e3a8a; --sc-cloud:#c4b5fd; --sc-paper:#1f1a45; --sc-board-ink:#ddd6fe; --sc-board-ok:#6ee7b7; --sc-board-warn:#fcd34d;
  --sc-hand:#f5f3ff; --sc-hand2:#c4b5fd; --sc-pot:#db2777;
  --sc-wood:#5b4bb5; --sc-wood2:#4c3fa0; --sc-wood3:#3f348a; --sc-leg:#2a2357; --sc-chair:#db2777; --sc-chair2:#f472b6;
  --sc-monitor:#0f0c29; --sc-scr-work:#134e4a; --sc-scr-stuck:#4a3a12; --sc-scr-done:#183a3a; --sc-scr-idle:#2a2550;
  --sc-label:#1f1a45; --sc-label-line:#8b80c9; --sc-label-ink:#f5f3ff; --sc-label-muted:#a5a0d0; --sc-zz:#c4b5fd;
  --sc-dot-work:#34d399; --sc-dot-stuck:#fbbf24; --sc-dot-done:#38bdf8; --sc-dot-idle:#6b6699; --sc-dot-empty:#3a3470;
}
html[data-theme=glass] body{background-color:#0f0c29;background-image:radial-gradient(circle at 12% 8%,rgba(124,58,237,.75) 0,transparent 42%),radial-gradient(circle at 88% 18%,rgba(14,165,233,.55) 0,transparent 40%),radial-gradient(circle at 50% 100%,rgba(219,39,119,.5) 0,transparent 45%);background-attachment:fixed}
html[data-theme=glass] .bar{background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html[data-theme=glass] .brand{font-weight:300;font-size:1.4rem;letter-spacing:.02em}
html[data-theme=glass] .strip{background:rgba(255,255,255,.04);border-bottom-color:rgba(255,255,255,.1)}
html[data-theme=glass] .panel{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:22px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
html[data-theme=glass] .panel h2{font-weight:300;font-size:1.55rem;letter-spacing:.01em}
html[data-theme=glass] .panel.needs{background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(244,114,182,.12));border-color:rgba(251,191,36,.45)}

html[data-theme=glass] .btn{border:0;border-radius:999px;background:linear-gradient(135deg,#c4b5fd,#f9a8d4);color:#160f33;box-shadow:0 6px 20px rgba(167,139,250,.35)}
html[data-theme=glass] .btn:hover{filter:brightness(1.08)}
html[data-theme=glass] .btn:active,html[data-theme=glass] .btn2:active,html[data-theme=glass] .tourBtn:active{transform:scale(.97);box-shadow:none}

html[data-theme=glass] .btn2:hover,html[data-theme=glass] .btn.no:hover,html[data-theme=glass] .langBtn:hover{background:rgba(255,255,255,.16);filter:none}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.45;overflow-wrap:break-word}
button,a{font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
html{font-size:100%}
.sizeCtl{display:flex;gap:4px;flex:none}
.sizeCtl button{width:44px;height:44px;padding:0;font-weight:700;cursor:pointer;line-height:1}
.sizeCtl .sm{font-size:15px}
.sizeCtl .lg{font-size:22px}
.sizeCtl button:disabled{opacity:.4;cursor:default}
.bar{background:var(--bar-bg);color:var(--bar-ink)}
.bar-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.125rem;margin-inline-end:6px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat small{display:block;font-size:0.6875rem;letter-spacing:.05em;text-transform:uppercase;color:var(--bar-muted)}
.stat b{font-size:1.125rem}
.barEnd{margin-inline-start:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.langBtn{background:var(--bar-btn);color:var(--bar-ink);border:2px solid var(--bar-btn-line);border-radius:8px;padding:8px 14px;
  font-weight:600;cursor:pointer;min-height:44px}
.langBtn:hover{filter:brightness(1.1)}
select.langBtn{appearance:none;-webkit-appearance:none;padding-inline-end:30px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-size:5px 5px;background-repeat:no-repeat;background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%}
html[dir=rtl] select.langBtn{background-position:16px 55%,21px 55%}
select.langBtn option{background:var(--panel);color:var(--ink)}
.tourBtn{background:var(--tour);color:var(--tour-ink);border:2px solid var(--tour-edge);border-radius:8px;
  padding:8px 16px;font-weight:700;cursor:pointer;min-height:44px;box-shadow:0 3px 0 var(--tour-edge)}
.tourBtn:hover{filter:brightness(1.05)} .tourBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--tour-edge)}
.tourBtn.fresh{animation:nudge 2.4s ease-in-out 3}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.strip{background:var(--soft);border-bottom:1px solid var(--line);font-size:0.875rem;color:var(--ink-soft)}
.strip div{max-width:1100px;margin:0 auto;padding:6px 16px}
.strip .err{color:var(--err);font-weight:600}

/* layout: ask on top, the office beside "waiting on you" and the feed; on a phone "waiting on you" comes first */
main{max-width:1100px;margin:0 auto;padding:14px 16px;display:grid;gap:14px;
  grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"ask ask" "office needs" "office feed" "office next";align-items:start}
#askPanel{grid-area:ask} #officePanel{grid-area:office} #nowCard{grid-area:needs} #feedPanel{grid-area:feed} #nextPanel{grid-area:next}
@media (max-width:759px){ main{grid-template-columns:minmax(0,1fr);grid-template-areas:"ask" "needs" "office" "feed" "next"} }
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow-card)}
.panel h2{font-size:1.125rem;margin:0 0 4px}
.hint{font-size:0.875rem;color:var(--muted);margin:0 0 10px}

/* the office scene and the speech bubble over a desk; the drawing itself stays left-to-right in both languages */
.sceneBox{position:relative}
.scene{border:2px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--sc-wall)}
.scene svg{display:block;width:100%;height:auto;direction:ltr}
.desk{cursor:pointer;outline:none}
.desk:hover .lbl,.desk:focus-visible .lbl{stroke:var(--accent);stroke-width:1.2}
.desk.sel .lbl{stroke:var(--accent);stroke-width:1.4}
.hl{animation:ty .36s steps(1) infinite}.hr{animation:ty .36s steps(1) infinite .18s}
@keyframes ty{50%{transform:translateY(-1.5px)}}
.ln{animation:ln 1.6s steps(5) infinite;transform-box:fill-box;transform-origin:left}
@keyframes ln{0%{transform:scaleX(.2)}100%{transform:scaleX(1)}}
.zz{animation:zz 2.4s steps(3) infinite}
@keyframes zz{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.bubble{position:absolute;z-index:5;width:min(280px,calc(100% - 12px));background:var(--card);border:2px solid var(--ink);border-radius:8px;
  padding:10px 12px;box-shadow:4px 4px 0 var(--hard-shadow)}
.bubble b{display:block;font-size:0.9375rem}
.bubble .meta{font-size:0.8125rem;color:var(--muted);margin:2px 0 4px}
.bubble .what{font-size:0.875rem;margin:0 0 10px}
.bubble .row{gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:0.8125rem;color:var(--ink-soft);margin-top:10px}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* buttons: every button says what happens */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 16px;border-radius:8px;cursor:pointer;
  text-decoration:none;font-weight:700;border:2px solid var(--accent-edge);background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-edge)}
.btn:hover{background:var(--accent-hover)} .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-edge)}
.btn2{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 14px;border-radius:8px;cursor:pointer;
  text-decoration:none;font-weight:600;border:2px solid var(--line-strong);background:var(--panel);color:var(--ink);box-shadow:0 3px 0 var(--line-strong)}
.btn2:hover{background:var(--hover)} .btn2:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-strong)}
.btn.sm,.btn2.sm{min-height:38px;padding:6px 12px;font-size:0.875rem}
.textBtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:8px 0;min-height:40px;text-decoration:underline;font-size:0.875rem}
:focus-visible{outline:3px solid var(--tour);outline-offset:2px}

/* waiting on you */
.needs{border-color:var(--warn-line);background:var(--amber-bg)}
.needs .kicker{font-size:0.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);margin:0 0 4px}
.big{font-size:1.1875rem;font-weight:700;margin:0 0 4px}
.sub{color:var(--ink-soft);font-size:0.9375rem;margin:0 0 12px}
.lab{font-size:0.8125rem;font-weight:700;color:var(--ink-soft);margin:6px 0 0}
.needs .topic{margin:0 0 2px}
.note{font-size:0.8125rem;color:var(--muted);margin:10px 0 0}
ol.queue{margin:4px 0 0;padding:0;padding-inline-start:20px;font-size:0.9375rem}
ol.queue li{margin:4px 0}
[hidden]{display:none!important}
.whyBox{background:var(--panel);border:1px solid var(--warn-line);border-radius:8px;padding:8px 12px;margin:8px 0 10px}
.whyBox .lab{margin:0 0 2px} .whyBox .sub{margin:0;font-size:0.9375rem}
.pick{font-size:0.9375rem;margin:0 0 12px;padding:8px 12px;border-radius:8px;background:var(--ok-bg);border:1px solid var(--ok-line)}
.pick b{color:var(--ok-ink)}
ol.steps{list-style:none;margin:0 0 12px;padding:0;counter-reset:st}
ol.steps li{counter-increment:st;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:0.875rem;border:2px solid currentColor;box-sizing:border-box}
ol.steps li.done::before{content:'✓';color:var(--ok-ink)}
ol.steps .txt{flex:1 1 220px;margin:0;font-size:0.9375rem}
ol.steps li.done .txt{color:var(--muted)}
.btn.no{background:var(--card);color:var(--ink);border-color:var(--line-strong);box-shadow:0 3px 0 var(--line-strong)}
.btn.no:hover{background:var(--hover-warm)}
.btn.yes,.btn.no{min-width:84px}
.btn.rec{outline:3px solid var(--tour);outline-offset:2px}
.btn[disabled],.btn2[disabled]{opacity:.55;cursor:wait}
.later{margin-top:10px;background:var(--panel);border:1px dashed var(--line-strong);border-radius:8px;padding:8px 10px}
.later .lab{margin:0}
.saved{margin:10px 0 0;font-size:0.9375rem;font-weight:600;color:var(--ok-ink)}
.saved.err{color:var(--err)}
.tag{display:inline-block;font-size:0.75rem;color:var(--warn);border:1px solid var(--warn-line);background:var(--card);border-radius:99px;padding:0 8px;margin-inline-start:6px}

/* ask: one box in, a visible route, then the request's real state */
.ask textarea{width:100%;min-height:84px;resize:vertical;border:2px solid var(--line-strong);border-radius:8px;padding:10px 12px;
  font:inherit;background:var(--card);color:var(--ink)}
.askHead{margin:0}
.askHead button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0;
  background:none;border:0;font:inherit;font-weight:700;color:inherit;text-align:start;cursor:pointer}
.askHead .chev::before{content:'▾';display:inline-block;font-size:1.25rem;line-height:1;transition:transform .15s}
html[dir=rtl] .askHead [aria-expanded=false] .chev::before{transform:rotate(90deg)}
html[dir=ltr] .askHead [aria-expanded=false] .chev::before{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){ .askHead .chev::before{transition:none} }
#askBody .hint{margin:2px 0 10px}
.askBar{margin:10px 0 4px}
.askBar #askSend{margin-inline-start:auto}
#routeWhy{margin:2px 0 0;font-size:0.8125rem}
#askMore{display:block}
.projPick{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.projPick select{min-width:0}
@media (max-width:560px){ .askBar #askSend{width:100%;margin-inline-start:0} }
.pics{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:8px 0 0}
.pic.file{width:auto;max-width:min(260px,100%);height:44px;display:flex;align-items:center;gap:6px;padding-inline:10px 34px;font-size:0.8125rem}
.pic.file bdi{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pic.file button{top:9px}
.pics .note{margin:0}
.pic{position:relative;width:64px;height:64px;border:2px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--card)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic button{position:absolute;top:2px;inset-inline-end:2px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-strong);
  background:var(--card);color:var(--ink);font-size:0.875rem;line-height:1;cursor:pointer;padding:0}
.ask textarea.drop{border-color:var(--accent-edge);background:var(--soft)}
.route{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:0.875rem;margin:8px 0 10px}
.route .lab{margin:0}
.route select{font:inherit;font-size:0.875rem;min-height:40px;max-width:100%;border:2px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--ink);padding:4px 8px}
.route select:disabled{opacity:.6}
@media (pointer:coarse){ .route select,.textBtn,.btn.sm,.btn2.sm{min-height:44px} }
.route .note{margin:0}
.reqs .lab{margin:14px 0 0}
.req{padding:10px 0;border-top:1px solid var(--line)}
.req .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req .top .note{margin:0}
.req .txt{margin:4px 0;font-size:0.9375rem}
.req .rep{margin:4px 0 6px;font-size:0.875rem;background:var(--soft);border-radius:6px;padding:6px 10px}
.badge{font-size:0.75rem;font-weight:700;border-radius:99px;padding:1px 9px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);white-space:nowrap}
.badge.send,.badge.unsent{color:var(--warn);border-color:var(--warn-line)}
.badge.working,.badge.building,.badge.included{color:var(--run-ink);border-color:var(--run-line);background:var(--run-bg)}
.badge.needs-you{color:var(--on-warn);background:var(--warn);border-color:var(--warn)}
.badge.result,.badge.ready{color:var(--ok-ink);border-color:var(--ok-line);background:var(--ok-bg)}
.ideaAdd{margin:0 0 12px}
.ideaAdd .row{flex-wrap:nowrap;margin-top:4px}
.ideaAdd input{flex:1;min-width:0;font:inherit;font-size:0.9375rem;min-height:44px;border:2px solid var(--line-strong);border-radius:8px;padding:8px 12px;background:var(--card);color:var(--ink)}
.ideas{list-style:none;margin:0;padding:0}
.ideas li{display:flex;gap:10px;align-items:center;padding:4px 0;border-top:1px solid var(--line);font-size:0.9375rem}
.ideas li:first-child{border-top:0}
.ideas label{display:flex;gap:10px;align-items:center;flex:1;cursor:pointer;min-height:40px}
.ideas input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.buildBox{margin-top:12px;background:var(--card);border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px}
.buildBox .sub{margin:0 0 8px}

/* feed */
.feed div{display:flex;gap:10px;font-size:0.875rem;padding:6px 0;border-top:1px solid var(--line)}
.feed div:first-child{border-top:0}
.feed div>span{flex:1;min-width:0}
.feed b{display:block}
.feed time{color:var(--muted);white-space:nowrap;min-width:70px}
footer{max-width:1100px;margin:0 auto;padding:4px 16px 28px;font-size:0.8125rem;color:var(--muted)}

/* tour: the step's part of the page is lit, everything else dims */
.spot{position:relative;z-index:1001;box-shadow:0 0 0 4px var(--tour),0 0 0 9999px var(--dim)!important;border-radius:10px}
#tourCatch{position:fixed;inset:0;z-index:1000}
#tourCard{position:fixed;z-index:1002;left:50%;bottom:16px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));
  background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:14px 16px;box-shadow:6px 6px 0 var(--hard-shadow)}
#tourCard .step{font-size:0.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);margin:0 0 2px}
#tourCard h3{font-size:1.1875rem;margin:0 0 6px}
#tourCard p{margin:0 0 8px;font-size:0.9375rem}
#tourCard .why{background:var(--soft);border-radius:6px;padding:8px 10px;font-size:0.875rem}
#tourCard .row{margin-top:12px}
#tourCard .skip{margin-inline-start:auto}
html[dir=rtl] [data-bidi], html[dir=rtl] [data-bidi-in]{text-align:right}
html[dir=ltr] [data-bidi], html[dir=ltr] [data-bidi-in]{text-align:left}
[dir=rtl] .stat small,[dir=rtl] .needs .kicker,[dir=rtl] #tourCard .step{letter-spacing:0}
/* feedback: three questions, then WhatsApp opens with the message ready */
#fbDlg{--fbfs:1.0625rem;font-size:var(--fbfs);border:0;border-radius:16px;padding:1.3em 1.3em 1.1em;width:min(32em,calc(100% - 32px));background:var(--panel);color:var(--ink);box-shadow:var(--shadow-modal);line-height:1.5}
#fbDlg::backdrop{background:var(--backdrop)}
#fbDlg .top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:.5em .75em;margin:0 0 .2em}
#fbDlg h3{flex:1 1 6em;min-width:0;margin:0;font-size:1.4em;line-height:1.25}
#fbDlg .sizeCtl button{border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#fbDlg .sizeCtl button:hover{border-color:var(--line-strong)}
#fbDlg .hint{margin:0 0 1em;color:var(--muted);font-size:.9em}
#fbDlg .qc{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:.85em 1em 1em;margin:0 0 .7em;transition:border-color .15s}
#fbDlg .qc:focus-within{border-color:var(--accent)}
#fbDlg .qh{display:flex;align-items:center;gap:.6em;font-weight:700;font-size:1.05em;margin:0 0 .6em;padding:0}
#fbDlg .n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.85em}
#fbDlg .rate{display:flex;gap:.4em}
#fbDlg .rate label{flex:1 1 0;min-width:0;max-width:3.2em}
#fbDlg .rate input{position:absolute;opacity:0;width:1px;height:1px}
#fbDlg .rate span{display:flex;align-items:center;justify-content:center;width:100%;height:2.6em;min-height:44px;border:2px solid var(--line-strong);border-radius:10px;background:var(--panel);cursor:pointer;font-weight:700;transition:background .15s,border-color .15s}
#fbDlg .rate span:hover{border-color:var(--accent)}
#fbDlg .rate input:checked+span{background:var(--accent);border-color:var(--accent-edge);color:var(--accent-ink)}
#fbDlg .rate input:focus-visible+span{outline:3px solid var(--tour);outline-offset:2px}
#fbDlg .scale{font-size:.82em;color:var(--muted);margin:.45em 0 0}
#fbDlg textarea{display:block;width:100%;min-height:4.6em;resize:vertical;border:2px solid var(--line);border-radius:10px;padding:.55em .7em;font:inherit;line-height:1.5;background:var(--panel);color:var(--ink);margin:0}
#fbDlg textarea::placeholder{color:var(--muted);opacity:.8}
#fbDlg textarea:focus{outline:none;border-color:var(--accent);background:var(--card)}
#fbDlg .row{display:flex;gap:.5em;flex-wrap:wrap;align-items:center;margin-top:1em}
#fbDlg .row .btn,#fbDlg .row .btn2{font-size:1em;min-height:44px}
#fbDlg .note{font-size:.82em;color:var(--muted);margin:.7em 0 0}
#fbSend[disabled]{cursor:not-allowed}
@media (prefers-reduced-motion:reduce){#fbDlg .qc,#fbDlg .rate span{transition:none}}
@media (prefers-reduced-motion:reduce){.hl,.hr,.ln,.zz,.tourBtn.fresh{animation:none}}
</style>

let lang = '', langChosen = false;
try { lang = localStorage.getItem('officeLang') || ''; langChosen = !!lang; } catch (e) {}
if (!STR[lang]) lang = /^(he|iw)/i.test(navigator.language || '') ? 'he' : 'en';
const t = (k, ...a) => { const v = STR[lang][k] ?? STR.he[k] ?? k; return typeof v === 'function' ? v(...a) : v; };
// a server text: its key when the page knows it, otherwise the text as sent
const L = (o, f) => { const k = o?.[f + 'Key']; return k && ('s.' + k) in STR[lang] ? t('s.' + k, o[f + 'Arg']) : (o?.[f] ?? ''); };
const LOC = () => lang === 'he' ? 'he-IL' : 'en-GB';

let data = null, lastOk = 0, selected = null, nowIdx = 0, failing = false, privacy = false;
const PALETTE = ['#7F77DD', '#1D9E75', '#D85A30', '#D4537E', '#378ADD', '#BA7517', '#639922', '#E24B4A', '#5F5E5A', '#2f6f62'];
function projColor(pid){
  const p = (data?.projects || []).find(x => x.id === pid);
  if (p?.color) return p.color;
  let h = 0; for (const c of String(pid || 'other')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function tx(v){ return v && typeof v === 'object' ? (v[lang] || v.he || v.en || '') : (v || ''); }
function projName(p){ return p.id === 'new-project' ? t('newProject') : (lang === 'en' && p.nameEn) || p.name; }
function officeName(){
  const o = data?.officeName;
  return (o && typeof o === 'object' ? o[lang] || o.he || o.en : o) || t('brand');
}

// the drawing's colors come from the skin (--sc-* in the CSS), read again on every redraw
const SC = {};
function readSkin(){
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['wall','rail','rail2','floor1','floor2','floorline','frame','glass','cloud','paper','board-ink','board-ok','board-warn','hand','hand2','pot',
    'wood','wood2','wood3','leg','chair','chair2','monitor','scr-work','scr-stuck','scr-done','scr-idle','label','label-line','label-ink','label-muted','zz',
    'dot-work','dot-stuck','dot-done','dot-idle','dot-empty']) SC[k] = cs.getPropertyValue('--sc-' + k).trim();
}
const P = (x,y,w,h,f,c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${c?` class="${c}"`:''}/>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = (x,y,txt,size,fill,extra='') => `<text x="${x}" y="${y}" style="font-size:${size}px;fill:${fill};font-family:var(--font)${extra}">${esc(txt)}</text>`;

function ago(iso){
  const s = Math.max(0, (Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return t('agoNow');
  if (s < 3600) return t('agoM', Math.round(s/60));
  if (s < 86400) return t('agoH', Math.round(s/3600));
  return t('agoD', Math.round(s/86400));
}
const hhmm = iso => new Date(iso).toLocaleTimeString(LOC(), {hour:'2-digit', minute:'2-digit'});

function kindIcon(k){ // small pixel sign above a working desk: what kind of action
  const c = '#4A4036';
  if (k==='read') return P(0,0,8,6,'#FFFFFF')+P(0,0,8,1,c)+P(0,5,8,1,c)+P(4,0,1,6,c);
  if (k==='write') return P(0,5,2,2,'#EF9F27')+P(2,3,2,2,'#EF9F27')+P(4,1,2,2,'#EF9F27')+P(6,0,2,1,c);
  if (k==='run') return P(0,0,9,7,'#2C2C2A')+P(1,2,2,1,'#5DCAA5')+P(3,3,1,1,'#5DCAA5')+P(1,4,2,1,'#5DCAA5')+P(5,5,3,1,'#5DCAA5');
  if (k==='web') return P(1,0,5,7,'#85B7EB')+P(0,1,7,5,'#85B7EB')+P(3,0,1,7,'#FFFFFF')+P(0,3,7,1,'#FFFFFF');
  if (k==='help') return P(0,2,3,3,'#F2C9A0')+P(5,0,3,3,'#F2C9A0')+P(0,5,3,2,'#AFA9EC')+P(5,3,3,2,'#AFA9EC');
  return P(0,0,8,7,'#FFFFFF')+P(1,1,6,1,c)+P(1,3,4,1,c)+P(1,5,5,1,c);
}

function deskSVG(d, x, y){
  const s = d.state, col = projColor(d.pid), on = s !== 'empty', title = on ? L(d, 'title') : t('free');
  const lbl = on ? `${title}: ${t('st.' + s)}` : t('st.empty');
  let g = `<g class="desk${selected===d.id?' sel':''}" data-id="${esc(d.id)}" ${on?'tabindex="0" role="button"':''} transform="translate(${x},${y})" aria-label="${esc(lbl)}"><title>${esc(lbl)}</title>`;
  g += P(-4,-26,80,84,'transparent');
  g += P(42,0,16,18,SC.chair)+P(44,2,12,14,SC.chair2);
  if (on){
    const dy = s==='idle' ? 3 : 0;
    g += P(44,-5+dy,12,5,'#5A3A22')+P(43,-3+dy,1,4,'#5A3A22')+P(44,dy,12,10,'#F2C9A0');
    g += s==='idle' ? P(46,5+dy,3,1,'#3A2A1E')+P(51,5+dy,3,1,'#3A2A1E') : P(46,4,2,2,'#3A2A1E')+P(52,4,2,2,'#3A2A1E')+P(48,8,4,1,'#C98F6A');
    g += P(41,10,18,10,col);
  }
  g += P(0,18,70,7,SC.wood)+P(2,25,66,12,SC.wood2)+P(4,28,62,1,SC.wood3)+P(4,37,4,4,SC.leg)+P(62,37,4,4,SC.leg);
  g += P(39,16,20,3,'#ECE9E2');
  if (s==='work') g += P(42,14,4,3,'#F2C9A0','hl')+P(52,14,4,3,'#F2C9A0','hr');
  else if (on) g += P(40,15,4,3,'#F2C9A0')+P(56,15,4,3,'#F2C9A0');
  const scr = {work:SC['scr-work'], stuck:SC['scr-stuck'], done:SC['scr-done'], idle:SC['scr-idle'], empty:SC['scr-idle']}[s];
  g += P(6,-1,28,19,SC.monitor)+P(8,1,24,14,scr)+P(18,17,4,2,SC.monitor);
  if (s==='work') g += P(10,3,16,2,'#1D9E75','ln')+P(10,7,12,2,'#5DCAA5','ln')+P(10,11,18,2,'#1D9E75','ln');
  if (s==='stuck') g += P(12,4,16,2,'#EF9F27')+P(12,8,10,2,'#EF9F27');
  if (s==='done') g += P(13,8,3,2,'#639922')+P(16,10,2,2,'#639922')+P(18,6,2,4,'#639922')+P(20,4,2,2,'#639922');
  g += P(62,11,5,7,SC.label)+P(62,11,5,2,on?col:SC['dot-idle']);
  if (s==='work') g += `<g transform="translate(60,-15)">${kindIcon(d.kind)}</g>`;
  if (s==='stuck' || s==='done'){
    g += '<g transform="translate(0,6)">';
    const bc = s==='stuck' ? '#BA7517' : '#2f6f62';
    g += P(58,-22,14,13,'#FFFFFF')+P(58,-22,14,1,bc)+P(58,-10,14,1,bc)+P(58,-22,1,13,bc)+P(71,-22,1,13,bc)+P(60,-9,3,3,'#FFFFFF');
    g += s==='stuck' ? P(64,-19,2,5,bc)+P(64,-13,2,2,bc) : P(61,-16,2,2,bc)+P(63,-14,2,2,bc)+P(65,-16,2,2,bc)+P(67,-18,2,2,bc);
    g += '</g>';
  }
  if (s==='idle') g += `<text class="zz" x="59" y="-1" style="font-size:7px;fill:${SC.zz};font-weight:600">z z</text>`;
  const dot = SC['dot-' + s];
  const name = title.length > 16 ? title.slice(0,15).trimEnd()+'…' : title;
  g += `<rect class="lbl" x="2" y="44" width="66" height="12" rx="3" fill="${SC.label}" stroke="${SC['label-line']}" stroke-width=".8" shape-rendering="auto"/>`;
  g += `<circle cx="8" cy="50" r="2" fill="${dot}" shape-rendering="auto"/>`;
  g += T(13, 52.4, name, 6.4, on ? SC['label-ink'] : SC['label-muted'], ';direction:ltr;unicode-bidi:plaintext').replace('<text ', '<text class="nm" ');
  return g + '</g>';
}

function drawScene(){
  const cols = innerWidth < 560 ? 2 : 3, cellW = 101, cellH = 74;
  const desks = (data?.desks || []).slice();
  while (desks.length < cols * 2) desks.push({id:'empty'+desks.length, state:'empty', pid:'other'});
  const rows = Math.ceil(desks.length / cols), W = cols*cellW + 18, top = 72, H = top + rows*cellH + 24;
  const svg = $('scene');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  // wall with a wood rail, then a warm wood floor
  readSkin();
  let s = P(0,0,W,62,SC.wall)+P(0,56,W,6,SC.rail)+P(0,62,W,4,SC.rail2);
  for (let i=0; 66+i*15 < H; i++) s += P(0,66+i*15,W,15,i%2?SC.floor1:SC.floor2)+P(0,66+i*15,W,1,SC.floorline);
  const win = x => P(x,10,40,34,SC.frame)+P(x+2,12,36,30,SC.glass)+P(x+19,12,2,30,SC.frame)+P(x+2,26,36,2,SC.frame)+P(x+5,31,10,4,SC.cloud)+P(x+25,16,8,3,SC.cloud);
  s += win(20) + win(W-60);
  const working = (data?.desks||[]).filter(d=>d.state==='work').length, waitN = (data?.waiting||[]).length;
  const bx = Math.round(W/2 - 52), mid = bx + 42, bidi = `;text-anchor:middle;direction:${lang === 'he' ? 'rtl' : 'ltr'}`;
  s += P(bx,6,84,46,SC.frame)+P(bx+2,8,80,42,SC.paper);
  s += T(mid,19,t('boardTitle'),6.6,SC['board-ink'],bidi);
  s += T(mid,31, working ? t('boardWork', working) : t('boardQuiet'), 7, SC['board-ok'], bidi + ';font-weight:600');
  if (data?.waiting) s += T(mid,43, t('boardWait', waitN), 7, SC['board-warn'], bidi + ';font-weight:600');
  const cx = bx + 100, now = new Date();
  const ha = (now.getHours()%12 + now.getMinutes()/60)/12*2*Math.PI, ma = now.getMinutes()/60*2*Math.PI;
  s += `<circle cx="${cx}" cy="26" r="9" fill="${SC.paper}" stroke="${SC.frame}" stroke-width="1.5" shape-rendering="auto"/>`;
  s += `<line x1="${cx}" y1="26" x2="${(cx+5*Math.sin(ha)).toFixed(1)}" y2="${(26-5*Math.cos(ha)).toFixed(1)}" stroke="${SC.hand}" stroke-width="1.5" shape-rendering="auto"/>`;
  s += `<line x1="${cx}" y1="26" x2="${(cx+7*Math.sin(ma)).toFixed(1)}" y2="${(26-7*Math.cos(ma)).toFixed(1)}" stroke="${SC.hand2}" stroke-width="1" shape-rendering="auto"/>`;
  const plant = x => P(x+2,58,10,8,SC.pot)+P(x,50,14,9,'#639922')+P(x+3,46,8,6,'#97C459')+P(x+4,56,6,2,'#3B6D11');
  s += plant(3) + plant(W-17);
  desks.forEach((d,i) => {
    const c = i % cols, r = Math.floor(i / cols);
    s += deskSVG(d, 22 + c*cellW, top + 26 + r*cellH);
  });
  svg.innerHTML = s;
  svg.querySelectorAll('text.nm').forEach(el => {
    const full = el.textContent.replace(/…$/, ''); let n = full.length;
    while (n > 1 && el.getComputedTextLength() > 52) el.textContent = full.slice(0, --n).trimEnd() + '…';
  });
  svg.querySelectorAll('.desk[role=button]').forEach(el => {
    const pick = () => { selected = el.dataset.id; drawScene(); drawBubble(true); };
    el.addEventListener('click', pick);
    el.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); pick(); } });
  });
}

function closeBubble(){ const was = selected; selected = null; $('bubble').hidden = true; drawScene();
  const el = was && $('scene').querySelector(`.desk[data-id="${CSS.escape(was)}"]`); if (el) el.focus(); }

function drawBubble(focus){
  const b = $('bubble'), d = (data?.desks||[]).find(x => x.id === selected);
  if (!d) { b.hidden = true; return; }
  $('bTitle').textContent = L(d, 'title');
  const doing = d.state==='work' && d.kind && d.kind !== 'other' ? ` · ${t('kd.' + d.kind)}` : '';
  $('bMeta').textContent = `${t('st.' + d.state)}${doing} · ${t('lastMove')} ${ago(d.since)} (${hhmm(d.since)})`;
  $('bWhat').textContent = L(d, 'line');
  $('bActions').innerHTML = (d.link ? `<a class="btn sm" href="${esc(d.link)}">${esc(t('openThis'))}</a>` : `<span class="note">${esc(t('noLink'))}</span>`)
    + `<button class="btn2 sm" type="button" id="bClose">${esc(t('close'))}</button>`;
  $('bClose').onclick = closeBubble;
  b.hidden = false;
  // place the bubble over the desk, kept inside the office box
  const box = $('sceneBox').getBoundingClientRect(), el = $('scene').querySelector(`.desk[data-id="${CSS.escape(d.id)}"]`);
  if (!el) return;
  const r = el.getBoundingClientRect(), bw = b.offsetWidth, bh = b.offsetHeight;
  let left = r.left - box.left + r.width/2 - bw/2, topY = r.top - box.top - bh - 4;
  if (topY < 0) topY = r.bottom - box.top + 4;
  left = Math.max(6, Math.min(left, box.width - bw - 6));
  b.style.left = left + 'px'; b.style.top = topY + 'px';
  if (focus) b.querySelector('a,button').focus();
}

/* one card at a time: Yes / No / Later records the answer through the local server; nothing else */
let cardId = null, nonce = '', busy = false;
const newNonce = () => [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2,'0')).join('');

function drawNow(){
  // no task list connected: the card has nothing to show, so it steps aside
  $('nowCard').hidden = !!data && !Array.isArray(data.waiting);
  const w = data?.waiting || [], has = w.length > 0;
  $('nowActions').hidden = !has; $('queueBtn').hidden = !has; $('nowSkip').hidden = !has;
  $('nowWhy').hidden = !has; $('nowNote').hidden = !has;
  if (!has) {
    $('nowHead').textContent = t('nowKicker');
    $('nowName').textContent = data ? t('nothingWaiting') : (privacy ? t('hiddenPrivacy') : t('loading'));
    $('nowTopic').hidden = true;
    $('nowPick').hidden = true; $('laterRow').hidden = true; $('queue').hidden = true; cardId = null;
    return;
  }
  nowIdx = nowIdx % w.length;
  const it = w[nowIdx], top = Math.min(5, w.length), open = !$('queue').hidden;
  if (it.id !== cardId) { cardId = it.id; nonce = newNonce(); $('laterRow').hidden = true; $('aLater').setAttribute('aria-expanded','false'); }
  $('nowHead').textContent = t('nowKickerN', w.length, nowIdx);
  // the question alone can be read cold, so the project and topic sit above it
  const topic = it.ask ? tx(it.name) : '';
  const pr = (data?.projects || []).find(x => x.id === it.pid);
  $('nowTopic').textContent = [pr ? projName(pr) : it.project, topic].filter(Boolean).join(' · ');
  $('nowTopic').hidden = !$('nowTopic').textContent;
  $('nowName').textContent = tx(it.ask) || tx(it.name);
  const why = it.why || [];
  $('nowWhy1').textContent = it.whyAuto ? (tx(why[0]) || t('whyWaiting')) : tx(why[0]);
  $('nowWhy2').textContent = it.whyAuto ? t('whyChat') : tx(why[1]);
  $('nowPick').hidden = !it.pick;
  if (it.pick) $('nowPick').innerHTML = `<b>${esc(t('pick', t(it.pick === 'yes' ? 'yes' : 'no')))}</b> <span data-bidi>${esc(tx(it.pickWhy))}</span>`;
  $('quickBtns').hidden = !it.quick;
  $('aYes').classList.toggle('rec', it.pick === 'yes'); $('aNo').classList.toggle('rec', it.pick === 'no');
  drawSteps(it);
  const st = (it.steps || []).length > 0, go = $('nowGo');
  go.hidden = it.quick;
  go.href = it.chat || it.newChat;
  go.textContent = it.chat ? t('goChat') : t('goNew');
  go.className = st ? 'btn2' : 'btn'; // with steps, the steps are the main buttons
  $('nowAnswer').hidden = st;
  $('nowNote').textContent = it.quick ? t('noteQuick') : st ? t('noteSteps') : (it.chat ? t('noteChat') : t('noteNew')) + t('noteLater');
  $('queueBtn').textContent = open ? t('hideList') : t('showList', top, w.length);
  $('queueBtn').setAttribute('aria-expanded', String(open));
  $('queue').innerHTML = w.slice(0, top).map(x => `<li><span data-bidi>${esc(tx(x.name))}</span>${x.main?`<span class="tag">${esc(t('tagMain'))}</span>`:''}${x.money?`<span class="tag">${esc(t('tagMoney'))}</span>`:''}</li>`).join('')
    + (w.length > top ? `<li style="list-style:none;color:var(--muted)">${esc(t('more', w.length - top))}</li>` : '');
}

function drawFeed(){
  const f = data?.feed || [];
  $('feed').innerHTML = f.length
    ? f.map(x => `<div><time datetime="${esc(x.at)}">${esc(ago(x.at))}</time><span><b data-bidi>${esc(L(x, 'who'))}</b><span data-bidi>${esc(L(x, 'what'))}</span></span></div>`).join('')
    : `<div>${esc(privacy ? t('feedPrivacy') : data ? t('feedQuiet') : t('notRead'))}</div>`;
}

function drawPulse(){
  const el = $('pulse'), working = (data?.desks||[]).filter(d=>d.state==='work').length;
  $('sWork').textContent = data ? working : '-';
  $('sWait').textContent = data && data.waiting ? data.waiting.length : '-';
  $('sAge').textContent = lastOk ? t('agoS', Math.round((Date.now() - lastOk)/1000)) : '-';
  if (privacy) { el.innerHTML = t('pulsePrivacy'); return; }
  if (failing && !lastOk) { el.innerHTML = t('pulseDown'); return; }
  if (failing) { el.innerHTML = t('pulseLost'); return; }
  el.textContent = lastOk ? t('pulseOk') : t('pulseConnecting');
}

let lastLive = '';
function announce(msg){ if (msg !== lastLive) { lastLive = msg; $('live').textContent = msg; } }

function drawAll(){ drawScene(); drawBubble(); drawNow(); drawFeed(); drawAsk(); drawNext(); drawPulse(); }

async function refresh(){
  try {
    const r = await fetch('/api/live', {cache:'no-store'});
    const j = await r.json();
    if (j.error === 'privacy') { privacy = true; data = null; selected = null; drawAll(); announce(t('livePrivacy')); return; }
    if (!r.ok || j.error) throw new Error(j.error || r.status);
    data = j; lastOk = Date.now(); failing = false; privacy = false;
    if (!langChosen && STR[data.defaultLang] && data.defaultLang !== lang) { lang = data.defaultLang; applyLang(); return; }
    if (selected && !data.desks.some(d => d.id === selected)) selected = null;
    $('brand').textContent = document.title = officeName();
    drawScene(); drawBubble(); drawNow(); drawFeed(); drawAsk(); drawNext();
  } catch (e) { failing = true; announce(t('liveLost')); }
  drawPulse();
}

/* language: one switch, everything redraws in place */
/* skin: colors and fonts only, the page itself stays the same */
function setTheme(th){
  document.documentElement.dataset.theme = th;

// reading direction of live text, counted in words: mostly-Hebrew text reads right to left, the rest left to right, a tie follows the page.
// A word with any Hebrew counts as Hebrew ("ל-Codex"); file names and code count as nothing, so one long path can't flip a Hebrew sentence.
const HE_CH = /[֐-׿]/, LA_CH = /[A-Za-z]/, CODE_W = /[\/\\_.=<>{}]|\d|^[A-Z-]{5,}$/;

  let he = 0, la = 0;

    else if (LA_CH.test(w) && !CODE_W.test(w.replace(/^[("'\[]+|[.,:;!?)"'\]]+$/g, ''))) la++;
  }
  return he > la ? 'rtl' : la > he ? 'ltr' : document.documentElement.dir;
}
function fixBidi(){
  document.querySelectorAll('[data-bidi]').forEach(n => {

/* attached files: saved on this computer when added; the request tells Claude where each one is.
   A picture shows a thumbnail, any other file shows its name */
const PIC_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'], PIC_MAX = 20 * 1024 * 1024, PIC_LIMIT = 6;
let askPics = [];
function drawPics(){
  const box = $('askPics');
  box.textContent = '';
  askPics.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = p.url ? 'pic' : 'pic file';
    d.innerHTML = (p.url ? `<img alt="${esc(t('picAlt', i + 1))}" src="${p.url}">` : `<span aria-hidden="true">📄</span><bdi>${esc(p.label)}</bdi>`)
      + `<button type="button" aria-label="${esc(t('picRemove', i + 1))}">×</button>`;
    d.querySelector('button').onclick = () => { if (p.url) URL.revokeObjectURL(p.url); askPics.splice(i, 1); drawPics(); $('askAddPic').focus(); };
    box.append(d);
  });
  box.hidden = !askPics.length;
}
function clearPics(){ askPics.forEach(p => p.url && URL.revokeObjectURL(p.url)); askPics = []; drawPics(); }
const toBase64 = f => new Promise((ok, bad) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1] || '');
  r.onerror = () => bad(r.error);
  r.readAsDataURL(f);
});
async function addPics(files){
  for (const f of files) {
    if (askPics.length >= PIC_LIMIT) { askMsg(t('picLimit', PIC_LIMIT), true); break; }
    if (!f.size) { askMsg(t('picEmpty'), true); continue; }
    if (f.size > PIC_MAX) { askMsg(t('picBig'), true); continue; }
    try {
      const [ok, j] = await post('/api/upload', {data: await toBase64(f), name: f.name || ''});
      if (!ok) throw new Error(j?.error === 'too-big' ? t('picBig') : t('picFail'));
      const pic = j.image.startsWith('IMG-') && PIC_TYPES.includes(f.type);
      if (!askPics.some(p => p.name === j.image)) askPics.push({name: j.image, url: pic ? URL.createObjectURL(f) : null, label: f.name || j.image});
      drawPics();
      askMsg(t('picAdded'));
    } catch (e) { askMsg(e.message || t('picFail'), true); }
  }
}

  if (files.length) { e.preventDefault(); addPics(files); }
});
$('askText').addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); $('askText').classList.add('drop'); } });
$('askText').addEventListener('dragleave', () => $('askText').classList.remove('drop'));
$('askText').addEventListener('drop', e => {
  $('askText').classList.remove('drop');
  const files = [...(e.dataTransfer?.files || [])];
  if (files.length) { e.preventDefault(); addPics(files); }
});
$('askText').addEventListener('input', drawRoute);
$('askProject').addEventListener('change', () => { projTouched = true; drawRoute(); });
$('askTarget').addEventListener('change', drawRoute);
$('askMore').addEventListener('click', () => { showRoute($('askRoute').hidden); if (!$('askRoute').hidden) $('askTarget').focus(); });
$('askToggle').addEventListener('click', () => showAsk(!askOpen));
showAsk(askOpen);
$('nowAnswer').addEventListener('click', () => {
  const it = (data?.waiting || [])[nowIdx % Math.max(1, (data?.waiting || []).length)];
  if (it) { const q = (tx(it.ask) || tx(it.name)).slice(0, 60); setTarget('item:' + it.id, () => t('tAnswer') + q); }
});

/* the next version: ideas wait; one build at a time, in a separate copy */
let buildNonce = newNonce(), nextBusy = false;
function nextMsg(text, err){ const m = $('nextSaved'); m.textContent = text; m.classList.toggle('err', !!err); m.hidden = false; announce(text); }
function drawNext(){
  const ideas = data?.ideas || [], b = data?.build;
  $('ideaList').innerHTML = ideas.length ? ideas.map(i => {
    const edit = i.state === 'queued' || i.state === 'included';
    return `<li>${edit
      ? `<label><input type="checkbox" data-idea="${esc(i.id)}" ${i.state === 'included' ? 'checked' : ''}><span data-bidi>${esc(L(i, 'text'))}</span></label>`
      : `<span data-bidi style="flex:1">${esc(L(i, 'text'))}</span><span class="badge ${esc(i.state)}">${esc(STR[lang]['il.' + i.state] ? t('il.' + i.state) : i.state)}</span>`}</li>`;
  }).join('') : `<li class="note">${esc(t('noIdeas'))}</li>`;
  $('ideaList').querySelectorAll('[data-idea]').forEach(c => c.onchange = async () => {
    c.disabled = true;
    const [ok] = await post('/api/idea-include', {id: c.dataset.idea, include: c.checked});
    if (!ok) { c.checked = !c.checked; nextMsg(t('toggleFail'), true); }
    await refresh();
  });
  const open = b && !['ready', 'cancelled'].includes(b.state);
  $('buildLine').innerHTML = b
    ? `<span class="badge ${esc(b.state)}">${esc(STR[lang]['bl.' + b.state] ? t('bl.' + b.state) : b.state)}</span> <span class="note">${esc(t('ideasN', b.count) + t('started', ago(b.at)))}</span><br><span data-bidi>${esc(L(b, 'line'))}</span>`
    : esc(t('noBuild'));
  const inc = ideas.filter(i => i.state === 'included').length;
  $('buildBtn').textContent = open ? t('buildOpen') : t('buildNew', inc);
  $('buildBtn').disabled = !open && !inc;
  $('buildCancel').hidden = !(open && b.state !== 'building');
}
let ideaNonce = newNonce();
$('ideaForm').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('ideaText').value.trim();
  if (nextBusy) return;
  if (!text || text.length > 500) { nextMsg(t('ideaLen'), true); $('ideaText').focus(); return; }
  nextBusy = true; $('ideaSave').disabled = true;
  try {
    const [ok, j] = await post('/api/idea', {text, nonce: ideaNonce});
    if (!ok) throw new Error(t('ideaFail'));
    // a new idea starts ticked, so the build button is ready right after saving
    if (!j.duplicate) await post('/api/idea-include', {id: j.idea, include: true});
    nextMsg(j.duplicate ? t('ideaDup') : t('ideaSaved'));
    $('ideaText').value = ''; ideaNonce = newNonce();
  } catch (err) { nextMsg(err.message, true); }
  nextBusy = false; $('ideaSave').disabled = false;
  await refresh();
});
$('buildBtn').addEventListener('click', async () => {
  if (nextBusy) return; nextBusy = true; $('buildBtn').disabled = true;
  try {
    const [ok, j] = await post('/api/build', {nonce: buildNonce});
    if (!ok && j.error === 'build-open') { location.href = j.link; nextMsg(t('buildAlready')); }
    else if (!ok) throw new Error(j.error === 'no-ideas' ? t('buildNoIdeas') : t('buildFail'));
    else { location.href = j.link; nextMsg(t('buildStarted')); buildNonce = newNonce(); }
  } catch (e) { nextMsg(e.message, true); }
  nextBusy = false; await refresh();
});
$('buildCancel').addEventListener('click', async () => {
  const b = data?.build; if (!b || nextBusy) return; nextBusy = true;
  const [ok, j] = await post('/api/build-cancel', {id: b.id});
  nextMsg(ok ? t('cancelled') : (j.error === 'running' ? t('cancelRunning') : t('cancelFail')), !ok);
  nextBusy = false; await refresh();
});

let narrow = innerWidth < 560;
addEventListener('resize', () => { const n = innerWidth < 560; if (n !== narrow) { narrow = n; drawScene(); } drawBubble(); });
setInterval(drawPulse, 1000);
setInterval(() => { if (!document.hidden) refresh(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
applyLang();
fixBidi();
refresh();
</script>
</body>
</html>
